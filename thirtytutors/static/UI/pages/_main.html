<main id="main">
  <div id="transcriptArea">
    <div id="emptyState">Hold the button below and start speaking.</div>
  </div>

  <div id="statusToast">
    <span id="statusToastIcon"></span>
    <span id="statusToastMessage"></span>
    <button id="statusToastRetryBtn" class="pill-btn" type="button" hidden>Retry</button>
  </div>

  <div id="waveformWrap">
    <canvas id="waveform"></canvas>
  </div>

  <div id="talkArea">
    <div id="talkRow">
      <button id="handsFreeBtn" class="icon-btn talk-side-btn" type="button" title="Hands-free listening (muted - click to unmute)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
      </button>
      <button id="talkBtn" type="button" aria-label="Hold to speak">
        <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      </button>
      <button id="cameraToggleBtn" class="icon-btn talk-side-btn" type="button" title="Show/hide avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      </button>
    </div>
    <span id="talkHint">Hold to speak</span>
  </div>
</main>
